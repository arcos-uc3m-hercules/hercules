# Used URI for internal items definition.
URI = imss://

# Block size (in KB).
BLOCK_SIZE = 512

# Used mount point in the client side.
MOUNT_POINT = /mnt/hercules/

# Path where the Hercules project is located.
HERCULES_PATH = /home/hercules/

# Hercules' build type to be used. 
# Empty keeps "build", in other case, this value is concatenate to the "build" 
# directory located in the HERCULES_PATH.
# Directory must exist, for example: <HERCULES_PATH>/build-debug, <HERCULES_PATH>/build-release,
# empty value: <HERCULES_PATH>/build
HERCULES_BUILD_TYPE = 

# Port listening in the metadata node service.
METADATA_PORT = 7500

# Port listening in the data node service.
DATA_PORT =     8500

# [>= 1] Initial number of data nodes to deploy.
NUM_DATA_SERVERS = 1

# [>= 1] Total number of metadadata nodes.
NUM_META_SERVERS = 1

# Total number of client nodes.
NUM_NODES_FOR_CLIENTS = 1

# Total number of clients per node.
NUM_CLIENTS_PER_NODE = 1

# [1, 0]: Client processes are sharing resources with data nodes.
ATTACHED = 0

# [0: Disable, 1: Automatic elasticity, 2: Prints metrics only, 
# 3: Manual malleability (intervals enabled, no auto-scaling)]
MALLEABILITY = 0
MALLEABILITY_COMMISSIONING_TOLERANCE = 100
MALLEABILITY_DECOMMISSIONING_TOLERANCE = 300
MALLEABILITY_WSIZE = 20
MALLEABILITY_THRESHOLD = 2500
# [0: NETWORK, 1: DISK, 2: BUFF_NETWORK]: Data migration mode used
# strictly for malleability decommissioning.
# 0: NETWORK (blocks transferred directly over network).
# 1: DISK (blocks flushed to shared checkpoint path,
# requires MALLEABILITY_CHECKPOINT_PATH).
# 2: BUFF_NETWORK (blocks buffered and flushed in batches over network).
MALLEABILITY_REORDER_MODE = 0

# Required when MALLEABILITY_REORDER_MODE is set to 1 (DISK)
# Path where data servers will store the checkpoint data during
# data migration. It must be a mount point available in all data nodes.
MALLEABILITY_CHECKPOINT_PATH = /tmp/hercules_checkpoint

# Slurm partition and account for dynamic data server commissioning (salloc).
SLURM_JOB_PARTITION = 
SLURM_ACCOUNT = 

# Maximum number of nodes (>= NUM_DATA_SERVERS) used to deploy 
# new data servers on malleability.
# 0 = unlimited (special case).
UPPER_BOUND_MALLEABILITY = 0

# File containing a list of nodes serving as data nodes-
# If this file does not exist and Slurm is enabled it 
# will be created and filled with the nodes already 
# allocated.
DATA_HOSTFILE = /home/data_hostfile 

# Same as "DATA_HOSTFILE" but used for malleability.
# We keep two list ("DATA_HOSTFILE" and ALLOC_DATA_HOSTFILE) because 
# some deployments can begin with less data servers than allocated nodes.
ALLOC_DATA_HOSTFILE = /home/data_hostfile

# Number of threads attending data requests.
THREAD_POOL = 1

# Maximum size used by the data nodes (GB)
# 0 = 75% of available memory.
STORAGE_SIZE = 0

# File containing a list of nodes serving as metadata nodes
# If this file does not exist and Slurm is enabled it 
# will be created and filled with the nodes already 
# allocated.
METADATA_HOSTFILE = /home/meta_hostfile

# [1, 2, 3]: Replication factor
REPL_FACTOR = 1

# [0: SYNC, 1: ASYNC]: Replication type
# 0: SYNC (all replicas are written synchronously)
# 1: ASYNC (first replica is written synchronously, the rest asynchronously)
REPL_TYPE = 1

# [none, SLOG_TIME, all]: Debug mode
DEBUG_LEVEL = none

# [RR, BUCKETS, HASH, CRC16b, CRC64b, LOCAL]: Distribution policy (RR by default)
POLICY = RR

# Path where Hercules is going to copy data from memory to disk (checkpoint).
CHECKPOINT_PATH =
# ./HerculesCheckpoint/

# Path where Hercules is going to do a persistent copy of the files (snapshot).
SNAPSHOT_PATH = 
#./HerculesSnapshot

# Colon-separated list of directories to be copy from Hercules to disk, 
# for example /mnt/hercules/directory1/:/mnt/hercules/directory2/
SNAPSHOT_PATHS_LIST= /mnt/hercules/

# Colon-separated list of directories to be excluded from the SNAPSHOT_PATHS_LIST.
IGNORE_PATHS_LIST=

# The size of the client-side prefetch buffer (in MiB).
# 0: Prefetch disabled.
PREFETCH_SIZE = 0

# [0: synchronous, 1: asynchronous]: IO type, synchronous or asynchronous.
# 0: Synchronous block transfers.
# 1: Multi-block asynchronous pipelined transfers.
ASYNC_IO = 0

# [0: NONE, 1: PEER]: UCX endpoint error handling mode.
# 0: UCP_ERR_HANDLING_MODE_NONE (enables shared memory 'sm' transport without peer failure handler).
# 1: UCP_ERR_HANDLING_MODE_PEER (requires transports with peer failure handlers).
UCX_ERR_PEER = 0
